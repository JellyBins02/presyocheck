<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Presyo Check</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="wrap" id="app"></div>
<script src="shared.js"></script>
<script>
var app=document.getElementById("app"),view=getUser()?"home":"login",msg="",stream=null,timer=null;
if(location.hash==="#signin")view="signin";
var promoFilter=getPromoFilter();
function stopScan(){if(timer){clearInterval(timer);timer=null}if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}}
function go(v){stopScan();view=v;render();window.scrollTo(0,0)}
function find(code){code=code.trim();var p=findP(code);if(p){location.href=urlCompare(p[0])}else{msg="No product with barcode "+esc(code)+" yet. Check the digits or try a name search.";go("home")}}
function render(){
 var h="";
 if(view==="login"){
  h='<h1>Presyo Check</h1><p class="mute">Scan a product to see its price at every store near you.</p>'+
  '<button class="btn main" data-a="guest">Continue as guest<small>Browse prices without an account</small></button>'+
  '<button class="btn" data-a="login">Log in<small>Demo: any name works, no password yet</small></button>'+
  '<button class="btn" disabled>Sign up<small>Coming soon</small></button>';
 }
 if(view==="home"){
  h='<div class="cols"><div class="side"><section class="panel"><div class="top"><span class="chip'+(user.guest?'':' in')+'">'+(user.guest?'Guest':esc(user.name))+'</span><button class="link" data-a="'+(user.guest?'login':'logout')+'">'+(user.guest?'Log in existing user':'Log out')+'</button></div>'+
  '<h2>Find a product</h2><p class="mute">Point your camera or upload a barcode image.</p>'+
  '<div id="scanbox"></div><button class="btn main" data-a="scan">Scan barcode</button>'+
  '<input type="file" id="barcodeUpload" accept="image/*" style="display:none"><button class="btn" data-a="upload-trigger">Upload barcode image</button>'+
  (msg?'<p class="msg" role="status">'+msg+'</p>':'')+
  '<form class="pair" data-a="code"><input class="in" id="code" inputmode="numeric" placeholder="Or type the barcode number" aria-label="Barcode number"><button class="btn" type="submit">Find</button></form>'+
  '<button class="btn'+(promoFilter?' main':'')+'" data-a="toggle-promo">🔥 On Promo'+(promoFilter?' (Active)':'')+'</button>'+
  '<button class="btn" '+(user.guest?'disabled':'data-a="add"')+'>Add a product'+(user.guest?'<small>Log in to add products</small>':'')+'</button></section><section class="panel bp"><h3>Browse products</h3><input class="in" id="name" type="search" placeholder="Search by product name" aria-label="Search by name" value="'+esc(Q)+'">'+filters()+'</section></div><div class="main"><div id="hits">'+hits()+'</div></div></div>';
 }
 if(view==="signin")h='<button class="link" data-a="back">‹ Back</button><h2>Log in</h2><p class="mute">Demo login for now: type any name. Passwords come later.</p><form data-a="signin"><input class="in" id="uname" maxlength="24" placeholder="Your name" aria-label="Your name" required><button class="btn main" type="submit">Log in</button></form>';
 if(view==="add")h='<button class="link" data-a="home">‹ Back</button><h2>Add a product</h2><p class="mute">Fill in what is on the shelf tag and the package.</p><form class="frm" data-a="add">'+bcbox()+fld("pn","Product name (include the variant)")+fld("pb","Brand name","","dl-b")+fld("pm","Parent company / manufacturer","","dl-m")+fld("pc","Product category (separate with commas)","","dl-c")+fld("po","Country of origin","","dl-o","Philippines")+fld("ps","Size / weight (for example 155 g)")+fld("st","Store name","","dl-s")+fld("sl","Store location (city or area)")+fld("pp","Current price (₱)","number")+
  '<label style="display:flex;align-items:center;gap:8px;margin:12px 0;cursor:pointer"><input type="checkbox" id="hasPromo" style="width:20px;height:20px"><b>Is this item on promo?</b></label>'+
  '<div id="promoFields" style="display:none;border:1px solid var(--line);padding:12px;border-radius:8px;margin-bottom:12px">'+
    promoFields()+
  '</div>'+
  '<label>Your rating<select class="in" id="rt"><option value="">No review yet</option><option value="5">5 stars</option><option value="4">4 stars</option><option value="3">3 stars</option><option value="2">2 stars</option><option value="1">1 star</option></select></label><label>Your review (optional)<textarea class="in" id="rv" rows="3"></textarea></label><button class="btn main" type="submit">Check and add product</button></form>'+dls();
 app.className="wrap v-"+view;app.innerHTML=h;
}
var F={b:"",m:"",c:"",o:""},Q="";
function bcbox(){return '<div id="scanbox"></div><label>Barcode (optional)<input class="in" id="bc" inputmode="numeric" placeholder="Scan, upload, or type the barcode"></label><div class="btns2"><button class="btn" type="button" data-a="fscan">Scan barcode</button><button class="btn" type="button" data-a="fupl">Upload image</button><button class="btn" type="button" data-a="ffill">Fill in details</button></div><input type="file" id="barcodeUploadModal" accept="image/*" style="display:none"><p class="msg" id="bcmsg" role="status"></p>'}
function fill(c){c=c.trim();var j=P.map(function(p){return p[0]}).indexOf(c),n=document.getElementById("bcmsg");
 if(j<0){n.textContent=c?"No details found for this barcode yet. Fill in the form by hand and the barcode will be saved with the product.":"Type or scan a barcode first.";return}
 var m=M[j],v={pn:m.n,pb:m.b,pm:m.m,pc:m.c,po:m.o,ps:P[j][2]};for(var k in v)document.getElementById(k).value=v[k];
 n.textContent="Details filled in for “"+m.n+"”. Add the store, location and price you saw."}
function onCode(c){if(view==="add"){stopScan();document.getElementById("scanbox").innerHTML="";document.getElementById("bc").value=c;fill(c)}else find(c)}
function fail(t){if(view==="add"){document.getElementById("scanbox").innerHTML='<p class="msg">'+t+'</p>'}else{msg=t;render()}}
var FN={b:["All brands","Brand name"],m:["All manufacturers","Parent company / manufacturer"],c:["All categories","Product category"],o:["All countries","Country of origin"]};
function vals(k){var s=[];M.forEach(function(m){if(!ok(m,k))return;(k==="c"?m.c.split(", "):[m[k]]).forEach(function(v){if(s.indexOf(v)<0)s.push(v)})});return s.sort()}
function fopen(k){var h='<div class="modal sheet" role="dialog" aria-modal="true" aria-label="'+FN[k][1]+'"><div class="dlg"><h2>'+FN[k][1]+'</h2><input class="in" id="fs" type="search" autocomplete="off" placeholder="Search '+FN[k][1].toLowerCase()+'" aria-label="Search '+FN[k][1]+'"><div class="list"><p class="mute" id="fnone" hidden>No match. Try a shorter word.</p><button class="item'+(F[k]?'':' sel')+'" data-a="fpick" data-k="'+k+'" data-v="">'+FN[k][0]+(F[k]?'':' ✓')+'</button>';
 vals(k).forEach(function(v){h+='<button class="item'+(F[k]===v?' sel':'')+'" data-a="fpick" data-k="'+k+'" data-v="'+esc(v)+'">'+esc(v)+(F[k]===v?' ✓':'')+'</button>'});
 app.insertAdjacentHTML("beforeend",h+'</div><button class="btn" data-a="dclose">Close</button></div></div>');var f1=app.querySelector(".modal .item");if(f1)f1.focus()}
document.addEventListener("keydown",function(e){if(e.key==="Escape"){var m=app.querySelector(".modal");if(m)m.remove()}});
var COLS=["#2f6fb0","#c0392b","#2a8f5b","#7a4b2a","#8e44ad","#d35400"],pend=null;
function V(id){var el=document.getElementById(id);return el?el.value.trim().replace(/[<>"]/g,""):""}
function fld(id,l,t,dl,v){return '<label>'+l+'<input class="in" id="'+id+'" type="'+(t||"text")+'"'+(t==="number"?' step="0.01" min="0.01"':'')+(dl?' list="'+dl+'"':'')+' value="'+(v||'')+'"></label>'}
function dls(){function u(f){var s=[];M.forEach(function(m){f(m).forEach(function(v){if(s.indexOf(v)<0)s.push(v)})});return s}
 function dl(id,a){return '<datalist id="'+id+'">'+a.sort().map(function(v){return '<option value="'+v+'">'}).join('')+'</datalist>'}
 return dl("dl-b",u(function(m){return [m.b]}))+dl("dl-m",u(function(m){return [m.m]}))+dl("dl-c",u(function(m){return m.c.split(", ")}))+dl("dl-o",u(function(m){return [m.o]}))+dl("dl-s",STORES.map(function(s){return s.n}).filter(function(v,i,a){return a.indexOf(v)===i}))}
function norm(s){return s.toLowerCase().replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(function(w,i,a){return w&&a.indexOf(w)===i})}
function sim(a,b){var x=norm(a),y=norm(b),n=x.filter(function(w){return y.indexOf(w)>=0}).length,u=x.length+y.length-n;return u?n/u:0}
function sidx(n,l){for(var i=0;i<STORES.length;i++)if(STORES[i].n.toLowerCase()===n.toLowerCase()&&STORES[i].l.toLowerCase()===l.toLowerCase())return i;return -1}
function where(i){return STORES.filter(function(_,s){return P[i][3][s]!=null}).map(function(s){return s.n+', '+s.l}).join('; ')}
function tryAdd(){
 var d={code:V("bc"),n:V("pn"),b:V("pb"),m:V("pm"),c:V("pc").split(",").map(function(s){return s.trim()}).filter(Boolean).join(", "),o:V("po"),z:V("ps"),s:V("st"),l:V("sl"),p:parseFloat(V("pp")),r:+V("rt"),t:V("rv")};
 d.promo=null;
 if(document.getElementById("hasPromo").checked){var rp=readPromo(d.p,user.name),er=document.getElementById("perr");
  if(rp.e){er.textContent=rp.e;return}
  er.textContent="";d.promo=rp.p}


 if(!(d.p>0)||!d.c)return;pend=d;
 d.j=d.code?P.map(function(p){return p[0]}).indexOf(d.code):-1;if(d.j>=0)return doAdd();
 var si=sidx(d.s,d.l),out=[];
 P.forEach(function(p,i){var sc=sim(d.b+" "+d.n,M[i].b+" "+M[i].n);if(sc>=0.45){var at=si>=0&&p[3][si]!=null;out.push({i:i,at:at,sc:sc+(at?1:0)})}});
 out.sort(function(a,b){return b.sc-a.sc});
 if(!out.length)return doAdd();
 var h='<div class="modal" role="dialog" aria-modal="true" aria-label="Possible duplicate"><div class="dlg"><h2>This may already exist</h2><p class="mute">Scroll through these similar products before adding “'+d.n+'” at '+d.s+', '+d.l+'. Tap one to view it.</p><div class="list">';
 out.forEach(function(o){var m=M[o.i];h+='<button class="item" data-c="'+P[o.i][0]+'"><b>'+m.n+'</b><small>'+P[o.i][2]+' · '+m.b+'</small><br>'+(o.at?'<span class="badge">Already listed at this store</span>':'<small>Sold at: '+where(o.i)+'</small>')+'</button>'});
 app.insertAdjacentHTML("beforeend",h+'</div><div class="btns"><button class="btn" data-a="dclose">Go back</button><button class="btn main" data-a="dadd">It’s different, add it</button></div></div></div>')}
function doAdd(){var d=pend;if(!d)return;
 var si=sidx(d.s,d.l);if(si<0){STORES.push({n:d.s,l:d.l});si=STORES.length-1;P.forEach(function(p){p[3].push(null);p[4].push(0);p[5].push(null)})}
 if(d.j>=0){var q=P[d.j],mm=M[d.j];q[3][si]=d.p;if(d.promo)q[5][si]=d.promo;if(d.r){q[4][si]=d.r;mm.rv=(mm.rv||RV).slice();mm.rv.unshift([user.name,d.r,d.t||"(no comment)"])}pend=null;saveDB();location.href=urlCompare(q[0]);return}
 var pr=STORES.map(function(){return null}),rt=STORES.map(function(){return 0}),proms=STORES.map(function(){return null});pr[si]=d.p;rt[si]=d.r;proms[si]=d.promo;
 P.push([d.code||"user-"+(P.length+1),d.n,d.z,pr,rt,proms]);
 M.push({n:d.n,b:d.b,m:d.m,c:d.c,o:d.o,t:[d.b,d.m].concat(d.c.split(", "),[d.o]),col:COLS[P.length%COLS.length],rv:d.r?[[user.name,d.r,d.t||"(no comment)"]]:[]});
 pend=null;saveDB();location.href=urlCompare(P[P.length-1][0])}
function hits(){
 var t=Q.toLowerCase(),o="";
 P.forEach(function(p,i){
  var m=M[i];
  if(!ok(m,""))return;
  if(t&&(m.n+' '+m.t.join(' ')).toLowerCase().indexOf(t)<0)return;
  
  var hasActivePromo=false;
  p[5].forEach(function(pr){if(isPromoActive(pr))hasActivePromo=true;});
  if(promoFilter && !hasActivePromo)return;


  o+='<button class="item" data-c="'+p[0]+'"><b>'+m.n+' '+(hasActivePromo?'<span class="badge" style="background:#EF4444;color:#fff">PROMO</span>':'')+'</b><small>Tags: '+m.t.join(', ')+'</small></button>';
 });
 return o||'<p class="mute">No product matches. Try fewer filters or a shorter word.</p>';
}
function ok(m,x){return (x==="b"||!F.b||m.b===F.b)&&(x==="m"||!F.m||m.m===F.m)&&(x==="o"||!F.o||m.o===F.o)&&(x==="c"||!F.c||m.c.split(", ").indexOf(F.c)>=0)}
function opts(k){var s=[];M.forEach(function(m){if(!ok(m,k))return;(k==="c"?m.c.split(", "):[m[k]]).forEach(function(v){if(s.indexOf(v)<0)s.push(v)})});s.sort();return s.map(function(v){return '<option'+(F[k]===v?' selected':'')+'>'+esc(v)+'</option>'}).join('')}
function filters(){return '<div id="fl">'+fl()+'</div>'}
function fl(){return '<div class="flt">'+[["b","All brands","Brand name"],["m","All manufacturers","Parent company / manufacturer"],["c","All categories","Product category"],["o","All countries","Country of origin"]].map(function(f){return '<div class="fw"><span class="fl-l">'+f[2]+'</span><button type="button" class="in fbtn" data-a="fopen" data-k="'+f[0]+'"><span class="ft">'+esc(F[f[0]]||f[1])+'</span><span aria-hidden="true">▾</span></button></div>'}).join('')+'</div><button class="link" data-a="clear">Clear filters</button>'}
async function scan(){
 var box=document.getElementById("scanbox");
 if(!("BarcodeDetector" in window)||!navigator.mediaDevices){fail("Camera scanning isn’t available in this browser. Type the barcode instead.");return}
 try{
  var det=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e"]});
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
  box.innerHTML='<div class="scan"><video id="vid" playsinline muted></video></div><p class="msg">Hold the barcode inside the frame.</p>';
  var v=document.getElementById("vid");v.srcObject=stream;await v.play();
  timer=setInterval(async function(){try{var r=await det.detect(v);if(r.length)onCode(r[0].rawValue)}catch(e){}},400);
 }catch(e){stopScan();fail("Couldn’t open the camera. Allow camera access, or type the barcode instead.")}
}
async function handleBarcodeImage(file){
 if(!("BarcodeDetector" in window)){
  if(view==="add") document.getElementById("bcmsg").textContent = "BarcodeDetector API is not supported in this browser.";
  else { msg = "BarcodeDetector API is not supported in this browser."; render(); }
  return;
 }
 try {
  var det = new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e"]});
  var imgEl = document.createElement("img");
  var url = URL.createObjectURL(file);
  imgEl.src = url;
  await new Promise((resolve, reject) => { imgEl.onload = resolve; imgEl.onerror = reject; });
  var codes = await det.detect(imgEl);
  URL.revokeObjectURL(url);
  if(codes.length > 0){
   onCode(codes[0].rawValue);
  } else {
   if(view==="add") document.getElementById("bcmsg").textContent = "No barcode detected in the uploaded image.";
   else { msg = "No barcode detected in the uploaded image. Try another photo."; render(); }
  }
 } catch(err){
  if(view==="add") document.getElementById("bcmsg").textContent = "Failed to process the uploaded image.";
  else { msg = "Failed to process the uploaded image."; render(); }
 }
}
app.addEventListener("click",function(e){
 var b=e.target.closest("button");if(e.target.classList.contains("modal")){e.target.remove();return}if(!b||b.disabled)return;
 var a=b.dataset.a;
 if(a==="guest"){user={guest:true};setUser(user);go("home")}
 if(a==="logout"){user={guest:true};setUser(null);msg="";go("login")}
 if(a==="home"){msg="";go("home")}
 if(a==="clear"){F={b:"",m:"",c:"",o:""};render()}
 if(a==="login")go("signin");
 if(a==="back")go("login");
 if(a==="add")go("add");
 if(a==="dadd")doAdd();
 if(a==="fopen")fopen(b.dataset.k);
 if(a==="fpick"){var k=b.dataset.k;F[k]=b.dataset.v;var md2=app.querySelector(".modal");if(md2)md2.remove();document.getElementById("fl").innerHTML=fl();document.getElementById("hits").innerHTML=hits();var fb=document.querySelector('.fbtn[data-k="'+k+'"]');if(fb)fb.focus()}
 if(a==="fscan")scan();
 if(a==="upload-trigger")document.getElementById("barcodeUpload").click();
 if(a==="fupl")document.getElementById("barcodeUploadModal").click();
 if(a==="ffill")fill(V("bc"));
 if(a==="dclose"){var md=app.querySelector(".modal");if(md)md.remove()}
 if(a==="scan")scan();
 if(a==="toggle-promo"){promoFilter=!promoFilter;setPromoFilter(promoFilter);render()}
 if(b.dataset.c)find(b.dataset.c);
});
document.addEventListener("change",function(e){
 if(e.target.id==="barcodeUpload" && e.target.files.length){
  handleBarcodeImage(e.target.files[0]);
  e.target.value = "";
 }
 if(e.target.id==="barcodeUploadModal" && e.target.files.length){
  handleBarcodeImage(e.target.files[0]);
  e.target.value = "";
 }
 if(e.target.id==="hasPromo"){
  var pf=document.getElementById("promoFields");
  if(pf) pf.style.display = e.target.checked ? "block" : "none";
 }
});
app.addEventListener("submit",function(e){e.preventDefault();var a=e.target.dataset.a;
 if(a==="code"){var c=document.getElementById("code").value;if(c.trim())find(c)}
 if(a==="signin"){var n=V("uname");if(n){user={guest:false,name:n};setUser(user);go("home")}}
 if(a==="add")tryAdd()});
app.addEventListener("input",function(e){if(e.target.id==="name"){Q=e.target.value;document.getElementById("hits").innerHTML=hits()}
 if(e.target.id==="fs"){var t=e.target.value.trim().toLowerCase(),n=0;app.querySelectorAll(".modal .list .item").forEach(function(b,i){var show=t?(i>0&&b.textContent.toLowerCase().indexOf(t)>=0):true;b.hidden=!show;if(show&&i>0)n++});document.getElementById("fnone").hidden=!t||n>0}});
app.addEventListener("change",function(e){var k=e.target.dataset.f;if(k){F[k]=e.target.value;document.getElementById("fl").innerHTML=fl();var s=document.querySelector('[data-f="'+k+'"]');if(s)s.focus();document.getElementById("hits").innerHTML=hits()}});


render();</script>
<script src="theme.js"></script>
</body>
</html>
